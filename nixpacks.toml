# Nixpacks build plan (used by Dokploy's "Nixpacks" build type).
# Builds the Vite app; `npm start` runs server/index.mjs on $PORT (default 3000), which serves dist/
# and hosts live sessions. Live rooms and uploaded images are written to /app/data, so mount a volume there.

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
# Nixpacks sets NODE_ENV=production, which would skip Vite and TypeScript (dev dependencies).
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build", "npm prune --omit=dev"]

[start]
cmd = "npm start"
